<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#f5f0ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C3FE8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6C3FE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- soft glow blobs -->
  <ellipse cx="200" cy="160" rx="320" ry="220" fill="url(#glow1)"/>
  <ellipse cx="1100" cy="560" rx="300" ry="200" fill="url(#glow2)"/>
  <ellipse cx="980" cy="120" rx="220" ry="160" fill="url(#glow1)" opacity="0.5"/>

  <!-- decorative circles representing youth community -->
  <circle cx="100" cy="100" r="6" fill="#6C3FE8" opacity="0.25"/>
  <circle cx="140" cy="70" r="4" fill="#9B6DFF" opacity="0.3"/>
  <circle cx="60" cy="180" r="8" fill="#C084FC" opacity="0.2"/>
  <circle cx="1180" cy="80" r="5" fill="#6C3FE8" opacity="0.2"/>
  <circle cx="1220" cy="140" r="9" fill="#9B6DFF" opacity="0.15"/>
  <circle cx="1140" cy="620" r="6" fill="#C084FC" opacity="0.25"/>
  <circle cx="80" cy="600" r="5" fill="#6C3FE8" opacity="0.2"/>
  <circle cx="50" cy="650" r="10" fill="#9B6DFF" opacity="0.12"/>

  <!-- interconnected dots network (community metaphor) -->
  <g opacity="0.12" stroke="#6C3FE8" stroke-width="1.2" fill="none">
    <line x1="200" y1="680" x2="340" y2="640"/>
    <line x1="340" y1="640" x2="440" y2="670"/>
    <line x1="440" y1="670" x2="560" y2="650"/>
    <line x1="900" y1="680" x2="1000" y2="660"/>
    <line x1="1000" y1="660" x2="1100" y2="680"/>
    <line x1="100" y1="30" x2="260" y2="50"/>
    <line x1="260" y1="50" x2="380" y2="30"/>
  </g>
  <g opacity="0.18" fill="#6C3FE8">
    <circle cx="200" cy="680" r="3.5"/>
    <circle cx="340" cy="640" r="3.5"/>
    <circle cx="440" cy="670" r="3.5"/>
    <circle cx="560" cy="650" r="3.5"/>
    <circle cx="900" cy="680" r="3.5"/>
    <circle cx="1000" cy="660" r="3.5"/>
    <circle cx="1100" cy="680" r="3.5"/>
    <circle cx="100" cy="30" r="3"/>
    <circle cx="260" cy="50" r="3"/>
    <circle cx="380" cy="30" r="3"/>
  </g>

  <!-- warning triangle motif (problem theme) -->
  <g opacity="0.06" fill="#6C3FE8">
    <polygon points="1200,30 1240,100 1160,100"/>
    <polygon points="40,400 80,470 0,470"/>
    <polygon points="640,10 670,62 610,62"/>
  </g>

  <!-- broken chain links (taboo/barrier theme) -->
  <g opacity="0.07" stroke="#6C3FE8" stroke-width="3" fill="none">
    <rect x="1060" y="200" width="28" height="18" rx="9"/>
    <rect x="1094" y="200" width="28" height="18" rx="9"/>
    <rect x="1128" y="200" width="28" height="18" rx="9"/>
    <!-- gap = broken -->
    <rect x="1050" y="236" width="28" height="18" rx="9" opacity="0.4"/>
  </g>

  <!-- subtle grid top-right -->
  <g opacity="0.05" stroke="#6C3FE8" stroke-width="0.8">
    <line x1="1040" y1="0" x2="1040" y2="180"/>
    <line x1="1080" y1="0" x2="1080" y2="180"/>
    <line x1="1120" y1="0" x2="1120" y2="180"/>
    <line x1="1160" y1="0" x2="1160" y2="180"/>
    <line x1="1200" y1="0" x2="1200" y2="180"/>
    <line x1="1240" y1="0" x2="1240" y2="180"/>
    <line x1="1280" y1="0" x2="1280" y2="180"/>
    <line x1="1020" y1="0" x2="1280" y2="0"/>
    <line x1="1020" y1="40" x2="1280" y2="40"/>
    <line x1="1020" y1="80" x2="1280" y2="80"/>
    <line x1="1020" y1="120" x2="1280" y2="120"/>
    <line x1="1020" y1="160" x2="1280" y2="160"/>
  </g>
</svg>
